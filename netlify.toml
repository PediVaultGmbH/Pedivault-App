# ─── PediVault — Netlify Configuration ───────────────────────────────────────

# ── Build ─────────────────────────────────────────────────────────────────────
[build]
  command   = "npm run build"
  publish   = "build"
  ignore    = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src/ public/ package.json"

[build.environment]
  NODE_VERSION    = "18"
  NPM_VERSION     = "9"
  CI              = "false"
  SKIP_PREFLIGHT_CHECK = "true"
  NODE_OPTIONS    = "--openssl-legacy-provider"

# ── Dev server (netlify dev) ───────────────────────────────────────────────────
[dev]
  command     = "npm start"
  port        = 3000
  targetPort  = 3000
  framework   = "#custom"

# ── SPA Routing — all paths serve index.html ──────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security Headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    X-XSS-Protection           = "1; mode=block"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security  = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy    = """
      default-src 'self';
      script-src  'self' 'unsafe-inline' 'unsafe-eval';
      style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src    'self' https://fonts.gstatic.com;
      img-src     'self' data: blob: https:;
      connect-src 'self' https://api.anthropic.com https://*.netlify.app https://pedivault-app-production.up.railway.app https://localhost:8000;
      frame-src   'none';
      object-src  'none';
    """

# ── Cache — static assets immutable (hashed filenames by CRA) ─────────────────
[[headers]]
  for = "/static/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── No cache for index.html (always fetch fresh) ──────────────────────────────
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"
    Expires       = "0"

# ── PWA manifest & service worker ─────────────────────────────────────────────
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type  = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
