<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PediVault — Child Health Records</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#9B3A56" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PediVault" />

    <!-- SEO -->
    <meta name="description" content="PediVault — your child's complete health record. Track vaccines, growth, appointments and medications. DSGVO compliant. Encrypted." />
    <meta property="og:title" content="PediVault — Child Health Records" />
    <meta property="og:description" content="The complete health record app for parents. Vaccines, growth charts, appointments and AI assistant." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      if('serviceWorker' in navigator){
        window.addEventListener('load',()=>{
          navigator.serviceWorker.register('/sw.js').catch(()=>{});
        });
      }
    </script>
  </body>
</html>
